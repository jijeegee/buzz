name: kuzz-prod

services:
  relay:
    image: ${KUZZ_IMAGE:-ghcr.io/block/buzz:main}
    env_file:
      - .env
    environment:
      KUZZ_BIND_ADDR: 0.0.0.0:3000
      KUZZ_HEALTH_PORT: "8080"
      KUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER:-kuzz}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kuzz}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      KUZZ_S3_ENDPOINT: http://minio:9000
      # Docker DNS resolves `minio`, not arbitrary `<bucket>.minio` hosts.
      KUZZ_S3_ADDRESSING_STYLE: path
      KUZZ_S3_ACCESS_KEY: ${KUZZ_S3_ACCESS_KEY:?set KUZZ_S3_ACCESS_KEY}
      KUZZ_S3_SECRET_KEY: ${KUZZ_S3_SECRET_KEY:?set KUZZ_S3_SECRET_KEY}
      KUZZ_S3_BUCKET: ${KUZZ_S3_BUCKET:-kuzz-media}
      KUZZ_GIT_REPO_PATH: /data/git
      KUZZ_AUTO_MIGRATE: ${KUZZ_AUTO_MIGRATE:-false}
      KUZZ_GIT_CONFORMANCE_PROBE: ${KUZZ_GIT_CONFORMANCE_PROBE:-true}
    ports:
      - "${KUZZ_HTTP_PORT:-3000}:3000"
    volumes:
      - kuzz-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no curl/wget/socat.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - kuzz-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuzz}
      POSTGRES_USER: ${POSTGRES_USER:-kuzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - kuzz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - kuzz-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - kuzz-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - kuzz-net

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${KUZZ_S3_ACCESS_KEY:?set KUZZ_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${KUZZ_S3_SECRET_KEY:?set KUZZ_S3_SECRET_KEY}
    volumes:
      - kuzz-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - kuzz-net

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      KUZZ_S3_ACCESS_KEY: ${KUZZ_S3_ACCESS_KEY:?set KUZZ_S3_ACCESS_KEY}
      KUZZ_S3_SECRET_KEY: ${KUZZ_S3_SECRET_KEY:?set KUZZ_S3_SECRET_KEY}
      KUZZ_S3_BUCKET: ${KUZZ_S3_BUCKET:-kuzz-media}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${KUZZ_S3_ACCESS_KEY}" "$${KUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${KUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${KUZZ_S3_BUCKET}"
      '
    restart: "no"
    networks:
      - kuzz-net

volumes:
  kuzz-postgres-data:
    labels:
      com.kuzz.volume: postgres
  kuzz-redis-data:
    labels:
      com.kuzz.volume: redis
  kuzz-minio-data:
    labels:
      com.kuzz.volume: minio
  kuzz-git-data:
    labels:
      com.kuzz.volume: git

networks:
  kuzz-net:
    driver: bridge
    labels:
      com.kuzz.network: production

services:
  relay:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    environment:
      KUZZ_DOMAIN: ${KUZZ_DOMAIN:?set KUZZ_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - kuzz-caddy-data:/data
      - kuzz-caddy-config:/config
    restart: unless-stopped
    networks:
      - kuzz-net

volumes:
  kuzz-caddy-data:
    labels:
      com.kuzz.volume: caddy-data
  kuzz-caddy-config:
    labels:
      com.kuzz.volume: caddy-config

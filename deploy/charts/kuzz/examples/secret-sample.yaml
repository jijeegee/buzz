# Sample Secret matching `secrets.existingSecret: kuzz-secrets`.
#
# Manage this via SealedSecrets / SOPS / External Secrets / Vault — anything
# that keeps the unencrypted form out of git. The chart reads keys it finds
# and leaves the rest as Pod env vars marked `optional: true`.
#
# Keys consumed by the relay (all optional unless required by relay config):
#   KUZZ_RELAY_PRIVATE_KEY        — 64-char hex; relay identity (do NOT rotate)
#   KUZZ_GIT_HOOK_HMAC_SECRET     — 32+ chars; required when replicaCount > 1
#   DATABASE_URL                  — postgres://...
#   READ_DATABASE_URL             — postgres://... (optional read-replica; omit to disable read routing)
#   REDIS_URL                     — redis://...  (required when replicaCount > 1)
#   KUZZ_S3_ACCESS_KEY
#   KUZZ_S3_SECRET_KEY
#   KUZZ_KLIPY_API_KEY            — omit to disable relay-proxied GIF search
apiVersion: v1
kind: Secret
metadata:
  name: kuzz-secrets
  namespace: kuzz
type: Opaque
stringData:
  KUZZ_RELAY_PRIVATE_KEY: "REPLACE_WITH_64_HEX"
  KUZZ_GIT_HOOK_HMAC_SECRET: "REPLACE_WITH_RANDOM_64_CHARS"
  DATABASE_URL: "postgres://kuzz:REPLACE@postgres.kuzz.svc.cluster.local:5432/kuzz?sslmode=require"
  REDIS_URL: "redis://:REPLACE@redis.kuzz.svc.cluster.local:6379"
  KUZZ_S3_ACCESS_KEY: "REPLACE"
  KUZZ_S3_SECRET_KEY: "REPLACE"
  KUZZ_KLIPY_API_KEY: "REPLACE"

{{- if .Values.storageAccounting.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kuzz.cronJobName" (dict "root" . "suffix" "storage-accounting") }}
  labels:
    {{- include "kuzz.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-accounting
spec:
  schedule: {{ .Values.storageAccounting.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.storageAccounting.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.storageAccounting.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.storageAccounting.activeDeadlineSeconds }}
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "kuzz.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: storage-accounting
            {{- with .Values.storageAccounting.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            {{- toYaml .Values.storageAccounting.podAnnotations | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ default (include "kuzz.serviceAccountName" .) .Values.storageAccounting.serviceAccountName }}
          securityContext:
            {{- toYaml .Values.relay.securityContext | nindent 12 }}
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: storage-accounting
              image: {{ include "kuzz.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- omit .Values.relay.containerSecurityContext "readOnlyRootFilesystem" | toYaml | nindent 16 }}
                readOnlyRootFilesystem: true
              command: ["/usr/local/bin/kuzz-admin"]
              args: ["storage-snapshot", "--max-objects", {{ .Values.storageAccounting.maxObjects | int64 | quote }}]
              env:
                {{- $s3Endpoint := include "kuzz.s3Endpoint" . }}
                {{- if $s3Endpoint }}
                - { name: KUZZ_S3_ENDPOINT, value: {{ $s3Endpoint | quote }} }
                {{- end }}
                - { name: KUZZ_S3_BUCKET, value: {{ .Values.s3.bucket | quote }} }
                - { name: KUZZ_S3_REGION, value: {{ .Values.s3.region | quote }} }
                - { name: KUZZ_S3_ADDRESSING_STYLE, value: {{ .Values.s3.addressingStyle | quote }} }
                - { name: KUZZ_STORAGE_SNAPSHOT_CODE_SHA, value: {{ include "kuzz.imageRevision" . | quote }} }
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "kuzz.envSecretName" . }}
                      key: DATABASE_URL
                - name: KUZZ_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "kuzz.envSecretName" . }}
                      key: KUZZ_S3_ACCESS_KEY
                      optional: true
                - name: KUZZ_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "kuzz.envSecretName" . }}
                      key: KUZZ_S3_SECRET_KEY
                      optional: true
              resources:
                {{- toYaml .Values.storageAccounting.resources | nindent 16 }}
{{- end }}

[workspace]
members = [
    "crates/kuzz-relay",
    "crates/kuzz-core",
    "crates/ifc-core",
    "crates/kuzz-conformance",
    "crates/kuzz-push-gateway",
    "crates/kuzz-db",
    "crates/kuzz-pubsub",
    "crates/kuzz-auth",
    "crates/kuzz-search",
    "crates/kuzz-audit",
    "crates/kuzz-acp",
    "crates/kuzz-agent",
    "crates/sprig",
    "crates/kuzz-test-client",
    "crates/kuzz-ws-client",
    "crates/kuzz-admin",
    "crates/kuzz-deletion",
    "crates/kuzz-feature-flags",
    "crates/kuzz-workflow",
    "crates/kuzz-media",
    "crates/kuzz-cli",
    "crates/kuzz-pairing-cli",
    "crates/kuzz-sdk",
    "crates/kuzz-token-broker",
    "crates/git-credential-kuzz",
    "crates/kuzz-persona",
    "crates/git-credential-nostr",
    "crates/git-sign-nostr",
    "crates/kuzz-pair-relay",
    "crates/kuzz-relay-mesh",
    "crates/kuzz-mesh-smoke",
    "crates/kuzz-dev-mcp",
    "crates/kuzz-voice",
    "crates/kuzz-backend-kubernetes",
    "crates/kuzz-datastore-tracing",
    "examples/countdown-bot",
]
exclude = ["desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/block/sprout"

[workspace.dependencies]
# Runtime
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
tokio-util  = { version = "0.7", features = ["rt", "codec"] }

# HTTP + WebSocket
axum        = { version = "0.8", features = ["ws", "macros"] }
tower       = { version = "0.5", features = ["timeout", "util", "limit"] }
tower-http  = { version = "0.6", features = ["trace", "cors", "compression-gzip", "limit", "timeout", "fs"] }

# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"
] }

# Redis
redis        = { version = "1.0", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }

# Kubernetes (kuzz-backend-kubernetes provider). No `ring` feature here: the
# process-level CryptoProvider is installed explicitly at startup, matching
# kuzz-cli/kuzz-acp/kuzz-admin/kuzz-relay/kuzz-dev-mcp — see the comment on the
# crate's own rustls dependency.
kube = { version = "2.0", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.26", features = ["v1_31"] }

# Nostr
nostr = { version = "0.44", features = ["nip44", "nip98"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
postcard    = { version = "1", default-features = false, features = ["use-std"] }

# Inter-relay mesh transport (kuzz-relay-mesh)
iroh = { version = "1.0.0-rc.0", default-features = false, features = ["tls-ring"] }
serde_json  = { version = "1", features = ["raw_value"] }
serde_yaml  = "0.9"
evalexpr    = "11"
cron        = "0.16"
# Observability
tracing                     = "0.1"
tracing-subscriber          = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry       = { version = "0.33" }
opentelemetry               = { version = "0.32", features = ["trace"] }
opentelemetry_sdk           = { version = "0.32", features = ["trace", "rt-tokio"] }
opentelemetry-otlp          = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "tls-ring"] }
metrics             = "0.24"
metrics-exporter-prometheus = "0.18"
metrics-util        = "0.20"

# Error handling
thiserror = "2"
anyhow    = "1"

# Utilities
uuid    = { version = "1", features = ["v4", "serde"] }
chrono  = { version = "0.4", features = ["serde"] }

# JWT / JWS verification (NIP-FI federated identity assertions)
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }

# HTTP client (webhook delivery)
reqwest = { version = "0.13", features = ["json", "rustls", "stream"], default-features = false }

# Cryptography
sha2      = "0.11"
hex       = "0.4"
hmac      = "0.13"
base64    = "0.22"

# Randomness
rand = "0.10"
subtle = "2.6"
zeroize = "1.8"

# Concurrent data structures
dashmap = "6"
moka    = { version = "0.12", features = ["sync"] }

# Async stream utilities
futures-util = "0.3"

# WebSocket client (test client)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"

# Property-based testing (dev-only)
proptest = "1"

# MCP SDK (used by kuzz-dev-mcp and kuzz-agent)
rmcp = { version = "1.1.0", features = ["server", "transport-io", "macros"] }
schemars = { version = "1", default-features = false }

# Internal crates
kuzz-core = { path = "crates/kuzz-core" }
kuzz-conformance = { path = "crates/kuzz-conformance" }
kuzz-db = { path = "crates/kuzz-db" }
kuzz-deletion = { path = "crates/kuzz-deletion" }
kuzz-feature-flags = { path = "crates/kuzz-feature-flags" }
kuzz-auth = { path = "crates/kuzz-auth" }
kuzz-pubsub = { path = "crates/kuzz-pubsub" }
kuzz-search = { path = "crates/kuzz-search" }
kuzz-audit = { path = "crates/kuzz-audit" }
kuzz-workflow = { path = "crates/kuzz-workflow" }
kuzz-media = { path = "crates/kuzz-media" }
kuzz-sdk = { path = "crates/kuzz-sdk" }
kuzz-ws-client = { path = "crates/kuzz-ws-client" }
kuzz-token-broker = { path = "crates/kuzz-token-broker" }
kuzz-relay-mesh = { path = "crates/kuzz-relay-mesh" }
kuzz-datastore-tracing = { path = "crates/kuzz-datastore-tracing" }

# CI profile — builds the relay for desktop e2e. Dependencies keep full
# release optimization (warm from main's cache; they carry the runtime hot
# path: tokio/sqlx/axum). Workspace crates build at opt-level 1 — enough for
# stable e2e timing (PR #307 flakiness was opt-0 + debug-assertions) at
# roughly half the codegen cost. Incremental stays disabled: rust-cache exports
# CARGO_INCREMENTAL=0, and the CI compiler cache requires non-incremental units.
[profile.ci]
inherits = "release"
lto = false
opt-level = 1

[profile.ci.package."*"]
opt-level = 3

# Sprig profile — optimized for deploy-anywhere Sprig release artifacts.
# Sprig is distributed over the network and installed on fresh hosts, so binary
# size matters more than compile speed here. Keep this separate from the normal
# `release` profile so desktop/dev release builds do not inherit the slower
# size-focused settings unless they opt in explicitly.
[profile.sprig]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Temporary fork pin: aws-creds 0.39.1 (via rust-s3) cannot read EKS Pod Identity
# credentials (AWS_CONTAINER_CREDENTIALS_FULL_URI + AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE),
# which the relay pod on bb-block requires for S3 media + git storage. This pins
# aws-creds to a fork that adopts the aws-creds portion of durch/rust-s3#449
# (FULL_URI + token-file + Authorization header, refresh-safe, with a loopback
# allowlist for the auth token). Revert to crates.io once #449 lands upstream.
[patch.crates-io]
aws-creds = { git = "https://github.com/tlongwell-block/rust-s3", rev = "c9fce3620dd434c1f810101d672cf384268dbb0f" }
# MeshLLM 0.76 uses rusqlite 0.40 / libsqlite3-sys 0.38. SQLx 0.9.0's
# optional SQLite driver still caps libsqlite3-sys below 0.38, which Cargo
# resolves even though Kuzz only enables PostgreSQL. Pin the merged upstream
# compatibility fix until it is released: https://github.com/transact-rs/sqlx/pull/4402
sqlx-sqlite = { git = "https://github.com/launchbadge/sqlx", rev = "94aafe3a68884d923b0798a767c8d7f6cfda89d2" }

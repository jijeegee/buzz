[package]
name = "kuzz-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Operator CLI for Kuzz relay administration"

[[bin]]
name = "kuzz-admin"
path = "src/main.rs"

[dependencies]
kuzz-db = { workspace = true }
kuzz-deletion = { workspace = true }
kuzz-core = { workspace = true }
kuzz-auth = { workspace = true }
kuzz-pubsub = { workspace = true }
kuzz-search = { workspace = true }
kuzz-audit = { workspace = true }
kuzz-workflow = { workspace = true }
kuzz-media = { workspace = true }
nostr = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
deadpool-redis = { workspace = true }
# Redis TLS (rediss://, e.g. ElastiCache) uses rustls, which needs a process
# CryptoProvider installed at startup. The workspace redis TLS feature compiles
# both aws-lc-rs and ring in transitively, so rustls can't auto-select one — we
# install ring explicitly in main(). Mirrors kuzz-relay's setup.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tracing = { workspace = true }
sqlx = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

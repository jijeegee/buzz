name: kuzz-platform
label: Kuzz
kind: platform
version: 3.0.0
description: >
  Kuzz gateway adapter for Hermes Agent, its own platform beside the bundled
  Buzz one. It receives through a supervised `kuzz messages watch` (every
  channel and DM) and replies through `kuzz messages send`, signing with the
  identity paired to this computer by `kuzz pair`.
author: Kuzz (based on the Hermes Agent Buzz plugin by Nous Research, MIT)
optional_env:
  - name: KUZZ_OWNER_PUBKEY
    description: "Owner pubkey (hex or npub); overrides the owner reported by `kuzz auth whoami`"
    prompt: "Owner pubkey (or empty)"
    password: false
  - name: KUZZ_CLI_PATH
    description: "Path to the kuzz CLI (default: kuzz on PATH, then the Kuzz app's copy)"
    prompt: "kuzz CLI path (or empty)"
    password: false
  - name: KUZZ_CHANNELS
    description: "Comma-separated channel UUIDs to answer in (default: every channel and DM)"
    prompt: "Channel UUIDs (comma-separated)"
    password: false
  - name: KUZZ_HOME_CHANNEL
    description: "Channel UUID for cron / notification delivery (defaults to the first listed channel)"
    prompt: "Home channel UUID (or empty)"
    password: false
  - name: KUZZ_ALLOWED_USERS
    description: "Extra people (npub or hex, comma-separated) who may talk to the agent; the owner is always allowed"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: KUZZ_REQUIRE_MENTION
    description: "Channel and thread messages must @mention the agent; DMs never need one (default true)"
    prompt: "Require a mention in channels? (true/false)"
    password: false
  - name: KUZZ_REACTION_ONLY_USERS
    description: "People (npub or hex) who get only a seen reaction when they mention the agent"
    prompt: "Reaction-only users (comma-separated)"
    password: false

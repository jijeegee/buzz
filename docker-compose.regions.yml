# =============================================================================
# Two-region test stack (global regions S3): each region has its own Postgres
# and Redis; media storage is shared, as in production.
#
# A separate Compose project so the dev stack and the harness are untouched.
# No volumes: every run starts empty.
#
#   Used by:  scripts/regions-two-region-test.sh
#   Ports:    kr postgres 5491 · redis 6491
#             jp postgres 5492 · redis 6492
#             minio 9491
#   Relays (run by the script): kr 3041 · jp 3042
# =============================================================================
x-postgres: &postgres
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: kuzz
    POSTGRES_PASSWORD: kuzz_dev
    POSTGRES_DB: kuzz
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U kuzz"]
    interval: 2s
    timeout: 5s
    retries: 30

x-redis: &redis
  image: redis:7-alpine
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  postgres-kr:
    <<: *postgres
    # The primary: jp's database copies its global tables (S5).
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "127.0.0.1:5491:5432"

  postgres-jp:
    <<: *postgres
    ports:
      - "127.0.0.1:5492:5432"

  redis-kr:
    <<: *redis
    ports:
      - "127.0.0.1:6491:6379"

  redis-jp:
    <<: *redis
    ports:
      - "127.0.0.1:6492:6379"

  minio:
    # Override with KUZZ_MINIO_IMAGE when the registry is unreachable.
    image: ${KUZZ_MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    # A directory under /data is a bucket.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/kuzz-media && exec minio server /data"]
    environment:
      MINIO_ROOT_USER: kuzz_dev
      MINIO_ROOT_PASSWORD: kuzz_dev_secret
    ports:
      - "127.0.0.1:9491:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
